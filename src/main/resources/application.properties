spring.application.name=demo
server.port=${PORT:8089}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/my_first_project}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Allow serialization of lazy-loaded JPA proxies
spring.jackson.serialization.fail-on-empty-beans=false

# File upload limits (medical documents)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=uploads/medical-docs
